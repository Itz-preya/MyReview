* {
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}

.box {
  width: 100%;
  height: auto; /* Changed height to auto for responsiveness */
 
}

nav {
  display: flex;
  justify-content: space-around;
  align-items: center;
}

nav ul {
  flex: 1;
  text-align: right; /* Center align the navigation links */
}

nav ul li {
  display: inline-block;
  list-style: none;
  margin: 10px;
  margin-left: 50px;
}

nav ul li a {
  text-decoration: none;
  color:black;
  position: relative;
  padding: 10px;
}

nav ul li a::before {
  content: '';
  width: 100%;
  height: 0px;
  position: absolute;
  z-index: -1;
  left: 0;
  bottom: -5px;
  border-bottom-left-radius: 8px;
  border-bottom-right-radius: 8px;
  background: orangered;
  transition: height 0.5s;
}

nav ul li a:hover::before {
    height: 85px;


}

.img {
  text-align: center; /* Center align the image */
}

.tex {
  text-align: center; /* Center align the text */
}

.action__btns {
  display: flex;
  justify-content: center; /* Center align the buttons */
  margin-top: 20px; /* Added margin for spacing */
}

.action__btns button {
  font-size: 13px;
  font-weight: 500;
  height: 35px;
  letter-spacing: 2px;
  padding: 0 20px; /* Adjusted padding for better spacing */
  outline: none;
  border: 2px solid var(--primary-color);
  border-radius: 10px;
  transition: 0.3s;
  cursor: pointer;
  background-color: #f8fafc;
}

/* Media query for smaller screens */
@media screen and (max-width: 768px) {
  .tex h1 {
    font-size: 20px; /* Decreased font size for smaller screens */
    bottom: -100px; /* Adjusted position for smaller screens */

}
